name: 更新央视卫视直播源

on:
  schedule:
    # 每天北京时间 6:00 和 18:00 各跑一次
    - cron: '0 22,10 * * *'
  workflow_dispatch:  # 允许在网页上手动点一次

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 检测并更新 cctv_ws.txt
        run: python3 scripts/update_cctv.py

      - name: 有变化才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add YSws.txt
          git diff --cached --quiet || git commit -m "自动更新直播源 $(date -u +%Y-%m-%d)"
          git push
